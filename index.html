<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Органиграмма АНПЗ</title>
<meta name="description" content="Интерактивная структура подразделений, руководства и сотрудников АНПЗ (прототип на моковых данных)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#F8FAFC; --surface-3:#EDF1F6;
  --text:#1A2433; --muted:#5B6B7F; --faint:#8492A6; --border:#E2E8F0; --line:#B3C0D0;
  --primary:#0B3B6F; --primary-ink:#0B3B6F; --accent:#1E88E5; --amber:#F2A900; --amber-soft:rgba(242,169,0,.16);
  --header-bg:#0B3B6F; --header-ink:#FFFFFF; --header-muted:rgba(255,255,255,.7); --header-field:rgba(255,255,255,.12);
  --shadow:0 2px 8px rgba(11,59,111,.08); --shadow-lg:0 16px 40px rgba(11,59,111,.18);
  --st-work:#1E9E5A; --st-vacation:#1E6FD9; --st-sick:#E07A1F; --st-trip:#7E57C2; --st-training:#0E9AA7; --st-other:#8A96A6;
  --radius:12px; --focus:0 0 0 3px rgba(30,136,229,.4);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1520; --surface:#152030; --surface-2:#1A2738; --surface-3:#22324A;
    --text:#E7EDF5; --muted:#9AAABF; --faint:#74859B; --border:#263649; --line:#41536C;
    --primary-ink:#7DB4F0; --accent:#4BA3F0; --amber:#F5B82E; --amber-soft:rgba(245,184,46,.16);
    --header-bg:#0A1F38; --header-field:rgba(255,255,255,.09);
    --shadow:0 2px 8px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
    --st-work:#34C276; --st-vacation:#5592F2; --st-sick:#F0953E; --st-trip:#A486E4; --st-training:#2CB9C5; --st-other:#8F9CAE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#152030; --surface-2:#1A2738; --surface-3:#22324A;
  --text:#E7EDF5; --muted:#9AAABF; --faint:#74859B; --border:#263649; --line:#41536C;
  --primary-ink:#7DB4F0; --accent:#4BA3F0; --amber:#F5B82E; --amber-soft:rgba(245,184,46,.16);
  --header-bg:#0A1F38; --header-field:rgba(255,255,255,.09);
  --shadow:0 2px 8px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --st-work:#34C276; --st-vacation:#5592F2; --st-sick:#F0953E; --st-trip:#A486E4; --st-training:#2CB9C5; --st-other:#8F9CAE;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.5 Inter,"PT Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-ink)}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.ic{flex:none;display:inline-block;vertical-align:middle}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.top{background:var(--header-bg);color:var(--header-ink);display:flex;align-items:center;gap:20px;padding:10px 20px;min-height:62px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;flex:none}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(140deg,#F2A900 0 38%,#fff 38% 100%);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.logo span{font-weight:700;font-size:11px;letter-spacing:.02em;color:#0B3B6F;margin-left:10px;margin-top:12px}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-txt b{font-size:16px;font-weight:700}
.brand-txt small{font-size:11.5px;color:var(--header-muted)}
.search{position:relative;flex:1;max-width:620px;margin:0 auto}
.search-box{display:flex;align-items:center;gap:8px;background:var(--header-field);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:0 10px;height:40px;transition:background .15s,border-color .15s}
.search-box:focus-within{background:#fff;color:#1A2433;border-color:#fff}
.search-box input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;color:inherit}
.search-box input::placeholder{color:var(--header-muted)}
.search-box:focus-within input::placeholder{color:#8492A6}
.search-box kbd{font:500 11px Inter,sans-serif;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:1px 6px;color:var(--header-muted);white-space:nowrap}
.search-box:focus-within kbd{border-color:#D5DCE5;color:#8492A6}
.q-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);max-height:min(70vh,520px);overflow:auto;padding:6px}
.q-group{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:10px 10px 4px}
.q-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px}
.q-item:hover,.q-item.active{background:var(--surface-3)}
.q-item .q-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.q-item .q-txt b{font-weight:600;font-size:14px}
.q-item .q-txt small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item mark{background:var(--amber-soft);color:inherit;border-radius:3px;padding:0 1px}
.q-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.q-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 10px 4px;border-top:1px solid var(--border);margin-top:6px;font-size:12px;color:var(--faint)}
.q-empty{padding:18px 12px;color:var(--muted);text-align:center}
.top-actions{display:flex;align-items:center;gap:10px;flex:none}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.top .seg{background:rgba(255,255,255,.1)}
.top .seg button{color:var(--header-muted)}
.top .seg button[aria-pressed="true"]{background:#fff;color:#0B3B6F}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn.sm{width:30px;height:30px;border-radius:7px;border-color:transparent;background:none;color:var(--muted)}
.icon-btn.sm:hover{background:var(--surface-3);color:var(--text)}
.top .icon-btn{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.top .icon-btn:hover{background:rgba(255,255,255,.2)}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:22px;padding:3px 12px 3px 3px}
.user-btn:hover{background:rgba(255,255,255,.2)}
.user-btn .ub-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;font-size:12.5px}
.user-btn .ub-txt small{color:var(--header-muted);font-size:11px}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);padding:8px;z-index:50}
.menu h4{margin:8px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.menu .opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:none;border-radius:8px;text-align:left}
.menu .opt:hover{background:var(--surface-3)}
.menu .opt .ck{width:18px;color:var(--accent)}
.menu .note{font-size:12px;color:var(--muted);padding:6px 8px;border-top:1px solid var(--border);margin-top:6px}

.body{display:grid;grid-template-columns:236px 1fr;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:auto}
.side nav{display:flex;flex-direction:column;gap:2px;padding:14px 10px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;position:relative}
.nav-item:hover{background:var(--surface-3);color:var(--text)}
.nav-item.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--primary-ink)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--amber)}
.nav-count{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--muted);border-radius:10px;padding:1px 8px}
.side-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.legend{display:grid;gap:6px;margin-bottom:14px}
.legend div{display:flex;align-items:center;gap:8px}
.sync-note{display:flex;gap:6px;align-items:flex-start}
main{min-width:0;min-height:0;overflow:auto;position:relative}
#view{min-height:100%;height:100%}
.bottom-nav{display:none}

/* ---------- status ---------- */
.st-work{--st:var(--st-work)} .st-vacation{--st:var(--st-vacation)} .st-sick{--st:var(--st-sick)}
.st-trip{--st:var(--st-trip)} .st-training{--st:var(--st-training)} .st-other{--st:var(--st-other)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;line-height:1;padding:4px 8px 4px 6px;border-radius:20px;color:var(--st);background:color-mix(in srgb,var(--st) 13%,transparent);white-space:nowrap}
.badge.lg{font-size:13px;padding:6px 11px 6px 8px}
.sdot{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--st);color:#fff;flex:none}

/* ---------- avatar ---------- */
.av{--s:40px;position:relative;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--avc);color:#fff;display:inline-grid;place-items:center;font-weight:600;font-size:calc(var(--s)*.36);letter-spacing:.01em}
.av-dot{position:absolute;right:-2px;bottom:-2px;width:calc(var(--s)*.34);height:calc(var(--s)*.34);min-width:12px;min-height:12px;border-radius:50%;background:var(--st);border:2px solid var(--surface);display:grid;place-items:center;color:#fff}
.av-dot svg{width:62%;height:62%}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:500;font-size:13.5px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#0E4A8A}
:root[data-theme="dark"] .btn-primary{background:#1D5FA8;border-color:#1D5FA8}
.btn-ghost{border-color:transparent;background:none;color:var(--muted)}
.btn-lg{height:46px;font-size:15px;border-radius:11px;flex:1}
.btn:disabled{opacity:.6;cursor:default}
.link{border:0;background:none;padding:0;color:var(--primary-ink);font-weight:500;text-align:left;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:2px}
.link:hover{text-decoration-color:currentColor}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;white-space:nowrap;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
select,.input{height:38px;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:0 10px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- structure ---------- */
.st-wrap{display:flex;flex-direction:column;height:100%}
.st-head{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--border);background:var(--surface)}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.summary .sum-label{font-weight:600;margin-right:4px}
.sum-chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface-2);border-radius:20px;padding:4px 12px 4px 5px;font-size:13px}
.sum-chip b{font-weight:700}
.sum-chip:hover{border-color:var(--st)}
.sum-upd{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.st-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:2px;font-size:13px;flex:1;min-width:0}
.crumbs button{border:0;background:none;color:var(--muted);padding:3px 6px;border-radius:6px}
.crumbs button:hover{background:var(--surface-3);color:var(--text)}
.crumbs button:last-child{color:var(--text);font-weight:600}
.crumbs .sep{color:var(--faint)}
.st-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.st-tools .seg button{display:inline-flex;align-items:center;gap:6px}
.viewport{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--line) 45%,transparent) 1px,transparent 1px);background-size:22px 22px}
.viewport.dragging{cursor:grabbing}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0;padding:36px;width:max-content;will-change:transform}
.canvas.anim{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.zoombar{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:3px}
.zoombar .icon-btn{border:0;width:34px;height:34px}
.zoombar .zv{min-width:48px;text-align:center;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.minimap{position:absolute;right:16px;bottom:16px;width:200px;height:130px;background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);cursor:pointer}
.hint{position:absolute;left:16px;top:14px;font-size:12px;color:var(--faint);pointer-events:none}

/* tree layout */
.tn{display:flex;flex-direction:column;align-items:flex-start}
.tn-root{align-items:center}
.kids-h{display:flex;align-items:flex-start;padding-top:22px;position:relative;animation:grow .22s ease-out}
.kids-h::before{content:"";position:absolute;top:0;left:50%;height:22px;border-left:1.5px solid var(--line)}
.kid-h{position:relative;padding:22px 14px 0}
.kid-h::before{content:"";position:absolute;top:0;left:0;right:0;border-top:1.5px solid var(--line)}
.kid-h:first-child::before{left:138px}
.kid-h:last-child::before{right:auto;width:138px}
.kid-h:only-child::before{display:none}
.kid-h::after{content:"";position:absolute;top:0;left:138px;height:22px;border-left:1.5px solid var(--line)}
.kids-v{margin-left:30px;position:relative;animation:grow .22s ease-out}
.kid-v{position:relative;padding:12px 0 0 24px}
.kid-v::before{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line)}
.kid-v::after{content:"";position:absolute;left:0;top:34px;width:24px;border-top:1.5px solid var(--line)}
.kid-v:last-child::before{bottom:auto;height:34px;width:24px;border-bottom:1.5px solid var(--line);border-bottom-left-radius:10px}
.kid-v:last-child::after{display:none}
@keyframes grow{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.node{width:248px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--dir);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;position:relative;transition:box-shadow .2s,border-color .2s}
.node:hover{box-shadow:0 6px 18px rgba(11,59,111,.13)}
.node-root{width:290px}
.node.active{border-color:var(--amber);border-top-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft),var(--shadow)}
.node.pulse{animation:pulse 1.4s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,169,0,.55)}100%{box-shadow:0 0 0 18px rgba(242,169,0,0)}}
.node-title{display:block;width:100%;text-align:left;font-weight:600;font-size:13px;line-height:1.3;color:var(--text);background:none;border:0;padding:0 0 8px}
.node-root .node-title{font-size:14px}
.node-title:hover{color:var(--primary-ink)}
.node-person{display:flex;gap:10px;align-items:center;width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:7px;text-align:left}
.node-person:hover{border-color:var(--border);background:var(--surface-3)}
.np-txt{display:flex;flex-direction:column;min-width:0;gap:1px}
.np-txt b{font-size:13px;font-weight:600;line-height:1.25}
.np-txt small{font-size:11.5px;color:var(--muted);line-height:1.3}
.np-txt .badge{margin-top:4px;align-self:flex-start;font-size:11px;padding:3px 7px 3px 5px}
.node-meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.nm-count{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.nm-people{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;background:none;padding:2px 6px;border-radius:7px;font-weight:600;color:var(--muted);font-size:12px}
.nm-people:hover{background:var(--surface-3);border-color:var(--border);color:var(--primary-ink)}

/* people org chart */
.pnode{width:248px;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--st);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;position:relative;cursor:pointer;text-align:left;transition:box-shadow .2s,transform .15s}
.pnode:hover{box-shadow:0 8px 22px rgba(11,59,111,.16);transform:translateY(-1px)}
.pnode:not(.st-work){background:linear-gradient(180deg,color-mix(in srgb,var(--st) 10%,var(--surface)) 0,var(--surface) 70px)}
.pnode-root{width:300px}
.pnode.active{box-shadow:0 0 0 3px var(--amber),var(--shadow)}
.pnode.pulse{animation:pulse 1.4s ease-out 2}
.pn-chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:11px;font-weight:600;color:var(--dir);background:color-mix(in srgb,var(--dir) 12%,transparent);border:0;border-radius:6px;padding:3px 7px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button.pn-chip:hover{background:color-mix(in srgb,var(--dir) 22%,transparent)}
.pn-chip-dep{--dir:var(--accent)}
.pn-main{display:flex;gap:12px;align-items:center}
.pn-txt{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.pn-txt b{font-size:14px;font-weight:700}
.pn-txt span{font-size:13px;font-weight:500}
.pn-txt small{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.pnode-root .pn-txt b{font-size:16px}
.pn-foot{display:flex;align-items:center;gap:6px 8px;margin-top:10px;flex-wrap:wrap}
.pn-foot .badge{font-size:11px;padding:3px 7px 3px 5px}
.pn-int{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pn-foot .node-toggle{margin-left:auto}
.pn-sub{margin-top:8px;padding-top:7px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--muted);display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pn-sub.warn{color:var(--st-sick)}
.av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.06);-webkit-user-drag:none;user-select:none}
.acc-people{padding:2px 16px 4px 46px}
.photo-stat{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-stat b{margin-right:auto}
.photo-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.photo-strip button{border:0;background:none;padding:2px;border-radius:50%;position:relative}
.photo-strip button.has::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 2px var(--st-work)}
.nm-st{display:flex;gap:6px;flex-wrap:wrap}
.mc{display:inline-flex;align-items:center;gap:2px;color:var(--st);font-weight:600}
.node-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:3px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:2px 8px 2px 5px;font-size:12px;font-weight:600;color:var(--muted)}
.node-toggle:hover{color:var(--text);border-color:var(--line)}
.node-toggle svg{transition:transform .2s}
.node-toggle[aria-expanded="false"] svg{transform:rotate(-90deg)}

/* list (accordion) */
.acc-wrap{flex:1;overflow:auto;padding:14px 16px 90px}
.acc{border-left:3px solid var(--dir);background:var(--surface);border-radius:10px;margin-top:6px;box-shadow:var(--shadow)}
.acc .acc{box-shadow:none;border-radius:8px;background:var(--surface-2);margin:6px 8px 0 14px}
.acc .acc .acc{background:var(--surface)}
.acc.active>.acc-row{background:var(--amber-soft)}
.acc-row{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px;border-radius:8px}
.acc-tg,.acc-tg-sp{width:30px;height:30px;flex:none;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.acc-tg:hover{background:var(--surface-3)}
.acc-tg svg{transition:transform .2s}
.acc-tg[aria-expanded="true"] svg{transform:rotate(90deg)}
.acc-main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:2px 0;display:flex;flex-direction:column}
.acc-name{font-weight:600;font-size:14px;line-height:1.3}
.acc-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-av{border:0;background:none;padding:2px;border-radius:50%}
.acc-count{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:38px;justify-content:flex-end}
.acc-kids{padding-bottom:8px}

/* ---------- pages ---------- */
.page{padding:24px 28px 100px;max-width:1320px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:4px 0 0}
.page-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;margin-bottom:14px}
.f-search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:9px;padding:0 10px;height:38px;flex:1 1 240px;color:var(--muted);background:var(--surface)}
.f-search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:5px 11px 5px 8px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip svg{color:var(--st)}
.chip[aria-pressed="true"]{border-color:var(--st);color:var(--st);background:color-mix(in srgb,var(--st) 12%,transparent)}
.tbl-wrap{overflow:hidden}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tbl th button{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px}
.tbl th button[aria-sort] {color:var(--text)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl .who{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left}
.tbl .who b{font-weight:600}
.tbl .who small{display:block;color:var(--muted);font-size:12px}
.tbl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);flex-wrap:wrap}
.pager{display:flex;gap:4px;align-items:center}
.pager button{min-width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px;font-size:13px}
.pager button[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{opacity:.45;cursor:default}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty svg{color:var(--faint);margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

.lead-gd{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:22px;margin-bottom:18px;border-top:4px solid var(--primary)}
.lead-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lead-card{padding:18px;border-top:3px solid var(--dir);display:flex;flex-direction:column;gap:12px}
.lead-top{display:flex;gap:14px;align-items:flex-start;border:0;background:none;padding:0;text-align:left}
.lead-top h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.lead-top p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.35}
.dir-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--dir)}
.dir-tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--dir)}
.contacts{display:grid;gap:6px;font-size:13px}
.contacts div{display:flex;align-items:center;gap:8px;color:var(--muted)}
.contacts a,.contacts b{color:var(--text);text-decoration:none;font-weight:500}
.contacts a:hover{color:var(--primary-ink)}
.lead-actions{display:flex;gap:8px;margin-top:auto}
.lead-actions .btn{flex:1;height:34px;font-size:13px}

.abs-group{margin-bottom:22px}
.abs-group h2{display:flex;align-items:center;gap:10px;font-size:15px;margin:0 0 10px}
.abs-group h2 .cnt{color:var(--muted);font-weight:500}
.abs-row{display:grid;grid-template-columns:minmax(220px,1.2fr) minmax(160px,.8fr) minmax(240px,1.3fr);gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.abs-row:last-child{border-bottom:0}
.abs-who{display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left;min-width:0}
.abs-who b{display:block;font-weight:600}
.abs-who small{display:block;color:var(--muted);font-size:12px;line-height:1.35}
.period{font-size:13px}
.period small{display:block;color:var(--muted);font-size:12px}
.sub{font-size:13px;line-height:1.45}
.sub-l{color:var(--muted)}
.sub-warn{display:flex;gap:6px;align-items:flex-start;margin-top:6px;padding:7px 9px;border-radius:8px;background:color-mix(in srgb,var(--st-sick) 12%,transparent);color:var(--text);font-size:12.5px}
.sub-warn svg{color:var(--st-sick);margin-top:1px}

.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.admin-grid .span2{grid-column:1/-1}
.panel{padding:18px}
.panel h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.panel>p{margin:0 0 14px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.progress{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:10px 0 2px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.res{font-weight:600;font-size:12.5px}
.res.ok{color:var(--st-work)} .res.warn{color:var(--st-sick)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.form-grid .full{grid-column:1/-1}
.manual-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle}
:root:not([data-theme="light"]) .manual-tag{color:var(--amber)}
.swatch{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--st);color:#fff}
.noaccess{max-width:520px;margin:60px auto;text-align:center;padding:36px}
.noaccess svg{color:var(--faint)}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:var(--surface-3);padding:2px 6px;border-radius:5px}

/* ---------- drawer ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,22,40,.38);z-index:60;opacity:0;visibility:hidden;transition:opacity .22s,visibility 0s .22s}
.overlay.open{opacity:1;visibility:visible;transition:opacity .22s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);z-index:70;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .24s cubic-bezier(.2,.7,.2,1),visibility 0s .24s;overflow:hidden}
.drawer.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.7,.2,1)}
.dr-scroll{overflow:auto;flex:1}
.dr-head{padding:22px 22px 18px;border-bottom:1px solid var(--border);position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--dir) 9%,var(--surface)),var(--surface));border-top:4px solid var(--dir)}
.dr-close{position:absolute;right:14px;top:14px}
.dr-grip{display:none}
.emp-hero{display:flex;gap:16px;align-items:center;padding-right:40px}
.emp-hero h2,.dept-hero h2{margin:0;font-size:19px;line-height:1.25;font-weight:700}
.emp-hero p{margin:3px 0 8px;font-size:13.5px}
.absent-box{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;gap:6px}
.acting{margin-top:10px;font-size:13px;color:var(--muted)}
.big-actions{display:flex;gap:10px;margin-top:16px}
.dr-body{padding:6px 22px 26px}
.fields{margin:0;display:grid}
.fields>div{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);align-items:center}
.fields dt{color:var(--muted);font-size:13px}
.fields dd{margin:0;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap;font-weight:500}
.fields dd a{text-decoration:none;color:var(--text)}
.fields dd a:hover{color:var(--primary-ink)}
.dr-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.dr-actions .btn{height:34px;font-size:13px}
.dr-note{font-size:12px;color:var(--faint);margin:18px 0 0;line-height:1.5}
.dept-hero{display:flex;gap:14px;align-items:flex-start;padding-right:40px}
.dept-ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--dir) 15%,transparent);color:var(--dir);flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--dir);margin-bottom:2px}
.alt-name{margin:4px 0 0;font-size:12.5px}
.chain{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dr-body section{padding:14px 0;border-bottom:1px solid var(--border)}
.dr-body section:last-of-type{border-bottom:0}
.dr-body h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:13.5px}
.grid2 a{text-decoration:none;font-weight:600;color:var(--text)}
.person{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px;margin:0 -8px;width:calc(100% + 16px);border-radius:10px}
.person:hover{background:var(--surface-3)}
.p-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.p-txt b{font-weight:600;font-size:13.5px}
.p-txt small{color:var(--muted);font-size:12px;line-height:1.35}
.p-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px}
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-3);gap:2px}
.sbar i{background:var(--st);display:block}
.slegend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px}
.slegend span{display:inline-flex;align-items:center;gap:6px}
.slegend b{font-weight:700}
.subrow{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 10px;margin-bottom:6px;text-align:left;font-weight:500;font-size:13.5px}
.subrow span:first-child{flex:1}
.subrow:hover{background:var(--surface-3)}

/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;background:#14243A;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:tin .2s ease-out}
.toast svg{color:#5FD69A}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.sk-wrap{padding:28px;display:grid;gap:18px;justify-items:center}
.sk-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}

#print-area{display:none}
.print-only{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .body{grid-template-columns:72px 1fr}
  .side nav{padding:12px 8px}
  .nav-item{justify-content:center;padding:11px}
  .nav-item span:not(.nav-count){display:none}
  .nav-count{position:absolute;top:3px;right:3px;padding:0 5px;font-size:10px}
  .side-foot{display:none}
  .user-btn .ub-txt{display:none}
  .user-btn{padding:3px}
}
@media (max-width:767px){
  .app{grid-template-rows:auto 1fr auto}
  .top{flex-wrap:wrap;gap:10px 10px;padding:10px 16px 12px}
  .brand-txt small{display:none}
  .top-actions{margin-left:auto;gap:6px}
  .search{order:3;flex:1 1 100%;max-width:none}
  .search-box kbd{display:none}
  .body{grid-template-columns:1fr}
  .side{display:none}
  .bottom-nav{display:flex;background:var(--surface);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--muted);text-decoration:none;border-radius:8px;position:relative;text-align:center;line-height:1.2}
  .bottom-nav a.active{color:var(--primary-ink);font-weight:600;background:none}
  .bottom-nav a::before{display:none}
  .bottom-nav .nav-count{position:absolute;top:2px;left:calc(50% + 6px);right:auto;margin:0;padding:0 5px;font-size:10px;background:var(--st-sick);color:#fff}
  .st-head{padding:12px 16px}
  .sum-upd{margin-left:0;width:100%}
  .st-tools .lbl{display:none}
  .crumbs{flex:1 1 100%}
  .acc-wrap{padding:10px 12px 24px}
  .page{padding:18px 16px 32px}
  .page-head h1{font-size:20px}
  .drawer{top:auto;left:0;width:100%;height:94dvh;border-radius:18px 18px 0 0;transform:translateY(100%)}
  .dr-grip{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-10px auto 12px}
  .dr-head{border-top:0;padding:18px 16px 16px}
  .dr-body{padding:4px 16px 28px}
  .fields>div{grid-template-columns:1fr;gap:2px}
  .big-actions .btn-lg{height:52px;font-size:16px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 12px;border-bottom:1px solid var(--border)}
  .tbl td{border:0;padding:3px 0;display:flex;gap:8px;font-size:13px}
  .tbl td[data-l]::before{content:attr(data-l);color:var(--muted);min-width:110px}
  .tbl td.c-who{padding-bottom:6px}
  .abs-row{grid-template-columns:1fr;gap:8px}
  .admin-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .lead-gd{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .minimap,.hint{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface-2:#fff;--surface-3:#f1f4f8;--text:#111;--muted:#444;--border:#ccd3dc;--line:#8a99ad;--shadow:none;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing-dir .app,body.printing-dir .drawer,body.printing-dir .overlay,body.printing-dir .toasts{display:none!important}
  body.printing-dir #print-area{display:block}
  body.printing-tree .top,body.printing-tree .side,body.printing-tree .bottom-nav,body.printing-tree .st-tools,body.printing-tree .zoombar,body.printing-tree .minimap,body.printing-tree .hint,body.printing-tree .drawer,body.printing-tree .overlay,body.printing-tree .toasts,body.printing-tree .sum-upd{display:none!important}
  body.printing-tree .app,body.printing-tree .body{display:block;height:auto}
  body.printing-tree main{overflow:visible}
  body.printing-tree .viewport{overflow:visible;background:none;height:auto}
  body.printing-tree .canvas{position:relative}
  body.printing-tree .print-only{display:block}
  body.printing-tree .st-head{border:0;padding:0 0 8px}
  #print-area{font:12px/1.4 Inter,Arial,sans-serif;color:#111}
  .pr-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #0B3B6F;padding-bottom:10px;margin-bottom:12px}
  .pr-head h1{margin:0;font-size:18px}
  .pr-head .pr-date{margin-left:auto;text-align:right;color:#555;font-size:11px}
  #print-area table{width:100%;border-collapse:collapse}
  #print-area th,#print-area td{border-bottom:1px solid #d5dbe3;padding:5px 6px;text-align:left;vertical-align:top}
  #print-area th{font-size:10.5px;color:#555;text-transform:uppercase;letter-spacing:.03em}
  #print-area tr.grp td{background:#eef2f7;font-weight:700;color:#0B3B6F}
  #print-area tr{break-inside:avoid}
  .pr-foot{margin-top:12px;font-size:10px;color:#777}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#/structure" aria-label="Органиграмма АНПЗ">
      <span class="logo" aria-hidden="true"><span>АНПЗ</span></span>
      <span class="brand-txt"><b data-i18n="appTitle"></b><small data-i18n="companyFull"></small></span>
    </a>
    <div class="search" id="search">
      <div class="search-box">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="q-results" data-i18n-ph="searchPh" data-i18n-aria="searchPh">
        <kbd>Ctrl K</kbd>
      </div>
      <div id="q-results" class="q-results" role="listbox" hidden></div>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Язык / Тіл">
        <button data-lang="ru" aria-pressed="true">RU</button>
        <button data-lang="kz" aria-pressed="false">KZ</button>
      </div>
      <button class="icon-btn" id="theme-btn" data-i18n-aria="theme"></button>
      <div class="user">
        <button class="user-btn" id="user-btn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="menu" id="user-menu" hidden></div>
      </div>
    </div>
  </header>
  <div class="body">
    <aside class="side">
      <nav id="side-nav" aria-label="Навигация"></nav>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main id="main" tabindex="-1"><div id="view"></div></main>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Навигация"></nav>
</div>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title" aria-hidden="true"><div class="dr-scroll" id="dr-scroll"></div></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

function resizeImage(file, size = 220){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error(file.name));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.width, img.height), sx = (img.width - s) / 2, sy = (img.height - s) * .3;
      const c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(file.name)); };
    img.src = url;
  });
}

const AV_COLORS = ['#2F6DB5','#0F7E80','#6B52A3','#3A7D44','#A23E6B','#4F5D95','#8C6420','#2E7D9A','#5C6B7A','#B2532B'];

/* =========================================================
   Data build (deterministic mock)
   ========================================================= */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry32(87102026);
const pick = a => a[Math.floor(R() * a.length)];
const rint = (a, b) => a + Math.floor(R() * (b - a + 1));

const TR = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya','ә':'a','ғ':'g','қ':'k','ң':'n','ө':'o','ұ':'u','ү':'u','һ':'h','і':'i'};
const translit = s => [...s.toLowerCase()].map(c => TR[c] ?? c).join('');
const NM = {'ё':'е','ә':'а','ғ':'г','қ':'к','ң':'н','ө':'о','ұ':'у','ү':'у','һ':'х','і':'и'};
const norm = s => [...String(s).toLowerCase()].map(c => NM[c] ?? c).join('');
const femSur = s => /(ов|ев|ин)$/.test(s) ? s + 'а' : s;

const D = {}, E = {};
const DEPTS = [], EMPS = [];

function buildData(){
  DEPT_SPEC.forEach((s, i) => {
    const d = { ...s, order:i, children:[], staff:[], headId:null };
    d.phone = `+7 (7122) 25-${rint(10, 99)}-${rint(10, 99)}`;
    D[d.id] = d; DEPTS.push(d);
  });
  DEPTS.forEach(d => { if (d.p) D[d.p].children.push(d.id); });
  const used = new Set(), emails = new Set();
  let n = 0, internalSeq = 2100;

  function mkEmp(d, posKey, isHead, o){
    let g = o?.g;
    if (!g){
      if (MALE_ONLY.has(posKey)) g = R() < .93 ? 'm' : 'f';
      else if (FEM_BIAS[posKey] != null) g = R() < FEM_BIAS[posKey] ? 'f' : 'm';
      else if (isHead) g = R() < .78 ? 'm' : 'f';
      else g = R() < .58 ? 'm' : 'f';
      if (posKey === 'gd') g = 'm';
    }
    let first, last, mid;
    if (o){ ({ first, last, mid } = o); }
    else {
      for (let tries = 0; tries < 40; tries++){
        if (R() < .68){ first = pick(g === 'm' ? KZ_M : KZ_F); last = pick(KZ_SUR); mid = pick(KZ_PAT) + (g === 'm' ? 'ович' : 'овна'); }
        else { first = pick(g === 'm' ? RU_M : RU_F); last = pick(RU_SUR); mid = pick(RU_PAT)[g === 'm' ? 0 : 1]; }
        if (g === 'f') last = femSur(last);
        if (!used.has(last + first)) break;
      }
    }
    used.add(last + first);
    const id = 'e' + (++n);
    internalSeq += 3;
    const internal = o?.internal || String(internalSeq);
    const cat = POS[posKey][2];
    let em = translit(last) + '.' + translit(first)[0];
    while (emails.has(em)) em += translit(first)[1] || '1';
    emails.add(em);
    const e = {
      id, last, first, mid, g, posKey, dept:d.id, isHead, cat,
      ru:`${last} ${first} ${mid}`, kz:`${last} ${first} ${mid}`,
      internal,
      work: cat === 'W' ? null : `+7 (7122) 25-${internal.slice(0, 2)}-${internal.slice(2)}`,
      mobile: cat === 'L' ? `+7 (701) ${rint(200, 989)}-${pad(rint(10, 99))}-${pad(rint(10, 99))}` : null,
      email: em + '@anpz.kz',
      office: d.room ? `${d.loc}, каб. ${d.room}${pad(rint(1, 24))}` : d.loc,
      status:'work', from:null, to:null, subId:null, hidden:false, manual:null,
      avc: AV_COLORS[n % AV_COLORS.length]
    };
    E[id] = e; EMPS.push(e); d.staff.push(id);
    if (isHead) d.headId = id;
    return e;
  }

  DEPTS.forEach(d => {
    mkEmp(d, d.head, true);
    d.staff_spec = d.staff;
  });
  DEPTS.forEach(d => {
    DEPT_SPEC.find(s => s.id === d.id).staff.forEach(s => {
      if (typeof s === 'string') mkEmp(d, s, false); else mkEmp(d, s.p, false, s.o);
    });
  });

  // managers
  // reporting lines: specialists of a unit with a deputy report to the deputy; secretaries — to the head
  const DIRECT = new Set(['secretary','assistant']);
  EMPS.forEach(e => {
    const d = D[e.dept];
    const dep = d.staff.map(x => E[x]).find(isDeputy);
    if (e.isHead) e.managerId = d.p ? D[d.p].headId : null;
    else if (dep && !isDeputy(e) && !DIRECT.has(e.posKey)) e.managerId = dep.id;
    else e.managerId = d.headId;
  });

  // statuses
  const forced = new Set();
  const H = id => E[D[id].headId];
  const byName = (last, first) => EMPS.find(e => e.last === last && e.first === first);
  const iv = byName('Иванов', 'Игорь'), iva = byName('Иванова', 'Елена');
  const deputyOf = id => D[id].staff.map(x => E[x]).find(isDeputy);
  const staffOf = (id, p) => D[id].staff.map(x => E[x]).find(e => e.posKey === p);
  function force(e, st, a, b, subId){ forced.add(e.id); e.status = st; if (st !== 'work'){ e.from = addDays(TODAY, a); e.to = addDays(TODAY, b); e.subId = subId || null; } }
  [H('d0'), H('d3'), H('d1'), H('d11'), iv, deputyOf('d111'), H('d6'), H('d4'), deputyOf('d6'), H('d61'), H('d62'), deputyOf('d62'), staffOf('d6', 'it_pm'), staffOf('d61', 'support')].forEach(e => force(e, 'work'));
  force(staffOf('d61', 'sysadmin'), 'vacation', -5, 9);
  force(staffOf('d62', 'dev1c'), 'sick', -1, 3);
  force(staffOf('d61', 'net_eng'), 'trip', -2, 2);
  force(staffOf('d6', 'infosec'), 'training', 0, 4);
  force(H('d111'), 'vacation', -7, 16, deputyOf('d111').id);
  force(H('d21'), 'trip', -1, 3, iv.id);
  force(H('d31'), 'vacation', -4, 12, iva.id);
  force(iva, 'sick', -2, 4);
  force(H('d5'), 'trip', 0, 5);
  force(H('d42'), 'training', -2, 9);

  const W = [['work', .86], ['vacation', .065], ['sick', .03], ['trip', .03], ['training', .01], ['other', .005]];
  EMPS.forEach(e => {
    if (forced.has(e.id)) return;
    let r = R(), st = 'work';
    for (const [c, w] of W){ if (r < w){ st = c; break; } r -= w; }
    e.status = st;
    if (st === 'vacation'){ e.from = addDays(TODAY, -rint(0, 10)); e.to = addDays(TODAY, rint(3, 20)); }
    if (st === 'sick'){ e.from = addDays(TODAY, -rint(0, 4)); e.to = addDays(TODAY, rint(1, 7)); }
    if (st === 'trip'){ e.from = addDays(TODAY, -rint(0, 3)); e.to = addDays(TODAY, rint(1, 9)); }
    if (st === 'training'){ e.from = addDays(TODAY, -rint(0, 2)); e.to = addDays(TODAY, rint(1, 5)); }
    if (st === 'other'){ e.from = TODAY; e.to = TODAY; }
  });

  // substitutes (as from HR system)
  EMPS.forEach(e => {
    if (e.status === 'work' || e.subId) return;
    const d = D[e.dept];
    const colleagues = d.staff.map(x => E[x]).filter(x => x.id !== e.id && x.status === 'work');
    let s = null;
    if (e.isHead){
      s = colleagues.find(isDeputy)
        || d.children.map(c => H(c)).find(x => x && x.status === 'work')
        || colleagues.find(x => x.cat === 'S');
    } else {
      s = colleagues.find(x => x.posKey === e.posKey) || colleagues.find(x => x.cat !== 'W' && !x.isHead) || colleagues.find(x => !x.isHead) || E[d.headId];
    }
    e.subId = s ? s.id : null;
  });

  EMPS.forEach(e => { e._orig = { office:e.office, subId:e.subId, hidden:e.hidden }; });
  applyOverrides();
  indexSearch();

  const now = new Date();
  const lastQ = new Date(now); lastQ.setMinutes(Math.floor(now.getMinutes() / 15) * 15, 0, 0);
  state.lastSync = lastQ;
  const at = (mAgo, base = lastQ) => new Date(base.getTime() - mAgo * 6e4);
  const night = new Date(TODAY); night.setHours(3, 0, 0, 0);
  state.syncLog = [
    { at:lastQ, src:'statusSync', res:'ok', ch:2, err:'' },
    { at:at(15), src:'statusSync', res:'ok', ch:0, err:'' },
    { at:at(30), src:'statusSync', res:'ok', ch:1, err:'' },
    { at:at(45), src:'adSync', res:'warn', ch:3, err:'Таймаут ответа LDAP (повтор успешен)' },
    { at:night < lastQ ? night : at(120), src:'structSync', res:'ok', ch:4, err:'' }
  ];
  if (!state.audit){
    state.audit = [
      { at:at(95).toISOString(), user:'hr.admin', action:'auditEdit', obj:`${iv.last} ${iv.first[0]}. — ${t('office')}` },
      { at:new Date(night.getTime() - 9 * 36e5).toISOString(), user:'sys.admin', action:'auditSync', obj:'1С:ЗУП' }
    ];
  }
}

function applyOverrides(){
  const ov = store.get('overrides', {});
  EMPS.forEach(e => { Object.assign(e, e._orig); e.manual = null; });
  Object.entries(ov).forEach(([id, o]) => {
    const e = E[id]; if (!e) return;
    if (o.office != null && o.office !== '') e.office = o.office;
    if (o.subId) e.subId = o.subId;
    e.hidden = !!o.hidden;
    e.manual = { by:o.by, at:o.at, fields:o.fields || [] };
  });
}

function indexSearch(){
  EMPS.forEach(e => {
    e._n = norm(e.ru); e._nl = translit(e._n);
    e._p = norm(POS[e.posKey][0] + ' ' + POS[e.posKey][1]);
    e._d = norm(D[e.dept].ru + ' ' + D[e.dept].kz + ' ' + D[e.dept].sh);
    e._dig = (e.internal + ' ' + (e.work || '').replace(/\D/g, '') + ' ' + (e.mobile || '').replace(/\D/g, ''));
  });
  DEPTS.forEach(d => { d._n = norm(d.ru + ' ' + d.kz + ' ' + d.sh); d._nl = translit(d._n); });
}

  return p.charAt(0).toLowerCase() + p.slice(1);

const dirColor = d => { let x = d; while (x && !x.c) x = D[x.p]; return x ? x.c : '#0B3B6F'; };
function descendants(id){ const out = [id]; D[id].children.forEach(c => out.push(...descendants(c))); return out; }
function deptEmps(id, nested){ const ids = nested ? descendants(id) : [id]; return ids.flatMap(x => D[x].staff.map(s => E[s])).filter(e => !e.hidden); }
function chain(id){ const out = []; let d = D[id]; while (d){ out.unshift(d); d = D[d.p]; } return out; }
function counts(list){ const c = {}; STATUSES.forEach(s => c[s.code] = 0); list.forEach(e => c[e.status]++); return c; }
const absentToday = () => visibleEmps().filter(e => e.status !== 'work');
function presentUp(e){ let m = E[e.managerId], g = 0; while (m && (m.status !== 'work' || m.hidden) && g++ < 10) m = E[m.managerId]; return m || null; }

const actingFor = e => e.status === 'work' ? visibleEmps().filter(x => x.status !== 'work' && subInfo(x)?.sub === e) : [];
function deptSorted(list){
  return list.slice().sort((a, b) => D[a.dept].order - D[b.dept].order || (b.isHead - a.isHead) || isDeputy(b) - isDeputy(a) || a.ru.localeCompare(b.ru, 'ru'));
}

function statusText(e){

function zoomAt(mx, my, factor, anim){

  const cr = cv.getBoundingClientRect(), er = el.getBoundingClientRect(), s = state.tf.s;

function lev(a, b){
  if (Math.abs(a.length - b.length) > 2) return 9;
  const v = Array.from({ length:b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    let prev = v[0]; v[0] = i;
    for (let j = 1; j <= b.length; j++){ const tmp = v[j]; v[j] = Math.min(v[j] + 1, v[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = tmp; }
  }
  return v[b.length];
}
function fuzzyIn(hay, q){
  if (q.length < 4) return false;
  const tol = q.length >= 7 ? 2 : 1;
  return hay.split(/\s+/).some(w => w.length >= q.length - 1 && lev(q, w.slice(0, q.length)) <= tol);
}
function scoreEmp(e, raw){
  const q = norm(raw.trim()); if (!q) return 1;
  const dig = raw.replace(/\D/g, '');
  const isDigits = /^[\d\s()+-]+$/.test(raw.trim());
  if (isDigits && dig.length >= 2){ if (e.internal === dig) return 100; return e._dig.includes(dig) ? 70 : 0; }
  const words = q.split(/\s+/).filter(Boolean);
  let total = 0;
  for (const w of words){
    let s = 0;
    if (e._n.startsWith(w)) s = 95;
    else if (e._n.includes(' ' + w)) s = 85;
    else if (e._n.includes(w)) s = 70;
    else if (e._nl.includes(w)) s = 65;
    else if (e.email.includes(w)) s = 50;
    else if (e._p.includes(w)) s = 40;
    else if (e._d.includes(w)) s = 30;
    else if (fuzzyIn(e._n, w) || fuzzyIn(e._nl, w)) s = 25;
    if (!s) return 0;
    total += s;
  }
  return total / words.length + (e.isHead ? 2 : 0);
}
function scoreDept(d, raw){
  const q = norm(raw.trim()); if (q.length < 2) return 0;
  const words = q.split(/\s+/).filter(Boolean);
  let tot = 0;
  for (const w of words){ let s = d._n.startsWith(w) ? 90 : d._n.includes(w) ? 70 : d._nl.includes(w) ? 60 : fuzzyIn(d._n, w) ? 25 : 0; if (!s) return 0; tot += s; }
  return tot / words.length;
}
function hl(text, raw){
  const q = norm(raw.trim()).split(/\s+/)[0]; if (!q || q.length < 2) return esc(text);
  const i = norm(text).indexOf(q); if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

  const dir = f.asc ? 1 : -1, so = STATUSES.map(s => s.code);

    status:(a, b) => so.indexOf(a.status) - so.indexOf(b.status)

function exportXlsx(list, scope){
  const withSt = canStatusExport() && state.dir.withStatus;
  const rows = deptSorted(list).map(e => {
    const r = { [t('col_dept')]:dname(D[e.dept]), [t('col_fio')]:nameOf(e), [t('col_pos')]:pos(e), [t('col_work')]:e.work || '', [t('col_int')]:e.internal, [t('col_email')]:e.email, [t('col_office')]:e.office || '' };
    if (withSt) r[t('col_status')] = statusText(e);
    return r;
  });
  const fname = `spravochnik_anpz_${scope}_${fmtD(new Date()).split('.').reverse().join('-')}`;
  if (window.XLSX){
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch:42 }, { wch:36 }, { wch:44 }, { wch:20 }, { wch:10 }, { wch:28 }, { wch:34 }, { wch:28 }];
    ws['!autofilter'] = { ref:ws['!ref'] };
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, state.lang === 'kz' ? 'Анықтамалық' : 'Справочник');
    XLSX.writeFile(wb, fname + '.xlsx');
  } else {
    const keys = Object.keys(rows[0] || {});
    const csv = '﻿' + [keys, ...rows.map(r => keys.map(k => r[k]))].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = fname + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  toast(t('exportDone'));
}

async function copy(text, msg){
  try { await navigator.clipboard.writeText(text); }
  catch (e){ const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
  toast(msg || `${t('copied')}: ${text}`);
}

  if (ds.lang){ state.lang = ds.lang; store.set('lang', state.lang); applyI18n(); renderUser(); rerender(); if ($('#q').value) renderSearch(); return; }
  if (tg.id === 'theme-btn'){ state.theme = effTheme() === 'dark' ? 'light' : 'dark'; store.set('theme', state.theme); applyTheme(); renderUser(); return; }
  if (tg.id === 'user-btn'){ const m = $('#user-menu'); m.hidden = !m.hidden; tg.setAttribute('aria-expanded', String(!m.hidden)); return; }
  if (ds.role){ state.role = ds.role; store.set('role', state.role); renderUser(); rerender(); return; }
  if (ds.themeSet){ state.theme = ds.themeSet; store.set('theme', state.theme); applyTheme(); renderUser(); return; }
  if (ds.qemp){ pickEmp(ds.qemp); return; }
  if (ds.qdept){ pickDept(ds.qdept); return; }
  if (ds.toggle){ toggleDept(ds.toggle); return; }
  if (ds.emp){ e.preventDefault(); openEmp(ds.emp); return; }
  if (ds.openDept){ state.activeDept = ds.openDept; if (state.renderedView === 'structure'){ renderCrumbs(); $$('.node.active,.acc.active').forEach(n => n.classList.remove('active')); $$(`[data-node="${ds.openDept}"]`).forEach(n => n.classList.add('active')); drawMinimapSoon(); } openDept(ds.openDept); return; }
  if (ds.crumb){ focusDept(ds.crumb); return; }
  if (ds.showTree){ state.activeDept = ds.showTree; chain(ds.showTree).forEach(d => state.expanded.add(d.id)); state.expanded.delete(ds.showTree); if (state.view === 'structure'){ go('structure'); focusDept(ds.showTree); } else { go('structure'); setTimeout(() => focusDept(ds.showTree), 80); } return; }
  if (ds.copy){ copy(ds.copy); return; }
  if (ds.copyLink){ const [k, id] = ds.copyLink.split(':'); copy(linkFor(k, id), t('linkCopied')); return; }
  if (ds.printDept){ printDirectory(deptEmps(ds.printDept, true), dname(D[ds.printDept])); return; }
  if (ds.xlsxDept){ exportXlsx(deptEmps(ds.xlsxDept, true), D[ds.xlsxDept].sh.replace(/\W+/g, '') || ds.xlsxDept); return; }
  if (ds.mode){ state.mode = ds.mode; store.set('mode2', ds.mode); state.tf = null; renderView(); return; }
  if (ds.sum){ state.dir = { ...state.dir, q:'', dept:'', st:new Set(ds.sum === 'work' ? ['work'] : [ds.sum]), cat:'', leaders:false, page:1 }; go('directory'); return; }
  if (ds.sort){ const f = state.dir; if (f.sort === ds.sort) f.asc = !f.asc; else { f.sort = ds.sort; f.asc = true; } renderDirTable(); return; }
  if (ds.page){ state.dir.page = +ds.page; renderDirTable(); $('#dir-table')?.scrollIntoView({ block:'nearest' }); return; }
  if (ds.stf){ const s = state.dir.st; s.has(ds.stf) ? s.delete(ds.stf) : s.add(ds.stf); tg.setAttribute('aria-pressed', String(s.has(ds.stf))); state.dir.page = 1; renderDirTable(); return; }
  if (ds.revert){ adminRevert(ds.revert); return; }
  switch (ds.act){
    case 'close': closeDrawer(); break;
    case 'zoom-in': { const vp = $('#vp'); zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.25, true); break; }
    case 'zoom-out': { const vp = $('#vp'); zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1 / 1.25, true); break; }
    case 'fit': fit(); break;
    case 'expand-all':
      if (curMode() === 'people') state.pexp = new Set(peopleKids(state.pDept).km.keys()); else DEPTS.forEach(d => d.children.length && state.expanded.add(d.id));
      curMode() !== 'list' ? (renderTree(), requestAnimationFrame(() => fit())) : renderList(); break;
    case 'collapse-all':
      if (curMode() === 'people') state.pexp = new Set([D[state.pDept].headId]); else state.expanded = new Set(['d0']);
      curMode() !== 'list' ? (renderTree(), requestAnimationFrame(() => fit())) : renderList(); break;
    case 'clear-photos': if (confirm(t('clearConfirm'))){ PHOTOS = {}; savePhotos(); addAudit('auditPhotoDel', '∀'); toast(t('photoRemoved')); afterPhotoChange(); } break;
    case 'print-tree': printTree(); break;
    case 'dir-reset': state.dir = { ...state.dir, q:'', dept:'', st:new Set(), cat:'', leaders:false, page:1 }; renderView(); break;
    case 'dir-xlsx': exportXlsx(dirFiltered(), state.dir.dept ? D[state.dir.dept].sh.replace(/\W+/g, '') || 'dept' : 'all'); break;
    case 'dir-print': printDirectory(dirFiltered(), state.dir.dept ? dname(D[state.dir.dept]) : t('wholePlant')); break;
    case 'search-all': { const q = $('#q').value; closeSearch(); state.dir = { ...state.dir, q, dept:'', st:new Set(), cat:'', leaders:false, page:1 }; if (state.view === 'directory') renderView(); else go('directory'); break; }
    case 'run-sync': runSync(); break;
    case 'adm-save': adminSave(); break;
  }
});
function closeMenus(e){
  const m = $('#user-menu'); if (!m.hidden && !(e && e.target.closest('.user'))){ m.hidden = true; $('#user-btn').setAttribute('aria-expanded', 'false'); }
  if (!(e && e.target.closest('#search'))) closeSearch();
}
$('#overlay').addEventListener('click', closeDrawer);
const qInput = $('#q');
qInput.addEventListener('input', renderSearch);
qInput.addEventListener('focus', () => { if (qInput.value.trim().length >= 2) renderSearch(); });
qInput.addEventListener('keydown', e => {
  const items = $$('#q-results .q-item');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault(); if (!items.length) return;
    qIdx = (qIdx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle('active', i === qIdx)); items[qIdx].scrollIntoView({ block:'nearest' });
  } else if (e.key === 'Enter'){
    e.preventDefault(); (items[qIdx] || items[0])?.click();
  } else if (e.key === 'Escape'){ closeSearch(); qInput.blur(); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' || (e.key === '/' && !typing)){ e.preventDefault(); qInput.focus(); qInput.select(); return; }
  if (e.key === 'Escape'){ if ($('#drawer').classList.contains('open')) closeDrawer(); closeMenus(); }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.classList.contains('pnode')){ e.preventDefault(); document.activeElement.click(); }
});

/* photo uploads (single in employee card, bulk in admin panel) */
function afterPhotoChange(){ renderView(); route(); }
function matchPhotoFile(name){
  const base = name.replace(/\.[^.]+$/, '').trim(), low = base.toLowerCase(), n = norm(base).replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (/^\d{3,5}$/.test(base)) return EMPS.find(e => e.internal === base);
  return EMPS.find(e => e.email.split('@')[0] === low)
    || EMPS.find(e => { const a = norm(e.last + ' ' + e.first), full = norm(e.ru); return n === a || n === full || n === translit(a) || n === translit(full); })
    || EMPS.find(e => n === norm(e.last) && EMPS.filter(x => x.last === e.last).length === 1);
}
document.addEventListener('change', async e => {
  const inp = e.target;
  if (inp.dataset && inp.dataset.photoUpload && inp.files && inp.files[0]){
    const id = inp.dataset.photoUpload;
    try {
      const prev = PHOTOS[id]; PHOTOS[id] = await resizeImage(inp.files[0]);
      const saved = savePhotos();
      if (!saved){ if (prev) PHOTOS[id] = prev; else delete PHOTOS[id]; toast(t('storageFull')); return; }
      addAudit('auditPhoto', shortName(E[id])); toast(saved === 'session' ? t('photoSession') : t('photoSaved')); afterPhotoChange();
    } catch (err){ toast('✕ ' + err.message); }
  }
  if (inp.id === 'bulk-photos' && inp.files && inp.files.length){
    let ok = 0; const miss = [];
    for (const f of inp.files){
      const emp = matchPhotoFile(f.name);
      if (!emp){ miss.push(f.name); continue; }
      try { PHOTOS[emp.id] = await resizeImage(f); ok++; } catch (_) { miss.push(f.name); }
    }
    const saved = savePhotos();
    if (!saved){ PHOTOS = store.get('photos', {}); toast(t('storageFull')); return; }
    if (saved === 'session') toast(t('photoSession'));
    addAudit('auditPhoto', `${ok} шт.`);
    toast(`${t('bulkDone')}: ${ok}${miss.length ? ` · ${t('unmatched')}: ${miss.length}` : ''}`);
    if (miss.length) console.info('Unmatched photo files:', miss);
    afterPhotoChange();
  }
});
let wasMobile = isMobile();
window.addEventListener('resize', () => { const m = isMobile(); if (m !== wasMobile){ wasMobile = m; if (!state.mode && state.renderedView === 'structure') renderView(); } });

/* =========================================================
   Boot
   ========================================================= */
buildData();
applyTheme(); applyI18n(); renderUser();
$('#view').innerHTML = `<div class="sk-wrap"><div class="sk" style="width:60%;height:34px"></div><div class="sk" style="width:290px;height:120px"></div><div class="sk-row">${'<div class="sk" style="width:248px;height:118px"></div>'.repeat(5)}</div></div>`;
state.view = parseHash().view; renderNav();
setTimeout(route, 300);
})();
</script>
